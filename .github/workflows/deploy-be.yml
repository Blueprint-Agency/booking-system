name: BE Deploy

# Both instances live on bpvps2:
#   staging branch -> booking-staging stack -> api.dev.reservetoday.app
#   main   branch -> booking-prod    stack -> api.reservetoday.app
# They share nothing but Traefik — separate containers, volumes, networks and
# databases, keyed off ENV_NAME in the compose file.
#
# The deploy is gated on the backend test suite: `deploy` needs `test`, so a red
# suite never reaches either stack. The same workflow runs both frontends'
# `check` scripts when their paths change — but Vercel deploys the frontends on
# its own and does not wait for GitHub checks, so for them a red check is a
# signal, not a gate. Pull requests into `staging`/`main` run every check and
# never deploy.
on:
  push:
    branches: [staging, main]
    paths:
      - 'be/**'
      - 'fe-client/**'
      - 'fe-portal/**'
      - '.github/workflows/deploy-be.yml'
  pull_request:
    branches: [staging, main]
    paths:
      - 'be/**'
      - 'fe-client/**'
      - 'fe-portal/**'
      - '.github/workflows/deploy-be.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  # The workflow-level `paths` above only decides whether the workflow runs at
  # all. A push touching only fe-client must not build and deploy the backend,
  # so each job below checks which app actually changed.
  changes:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      # paths-filter lists a pull request's files through the API.
      pull-requests: read
    outputs:
      be: ${{ steps.filter.outputs.be }}
      fe-client: ${{ steps.filter.outputs.fe-client }}
      fe-portal: ${{ steps.filter.outputs.fe-portal }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - id: filter
        uses: dorny/paths-filter@v3
        with:
          # Without this a push to `staging` is diffed against `main` (the default
          # branch), so every push reports `be` changed while `staging` is ahead
          # of `main` on `be/**` — and a frontend-only push redeploys the backend.
          # Naming the pushed branch diffs against the commit before the push.
          # Ignored for pull requests, which diff against their base.
          base: ${{ github.ref }}
          filters: |
            be:
              - 'be/**'
              - '.github/workflows/deploy-be.yml'
            fe-client:
              - 'fe-client/**'
              - '.github/workflows/deploy-be.yml'
            fe-portal:
              - 'fe-portal/**'
              - '.github/workflows/deploy-be.yml'

  test:
    needs: changes
    # A manual dispatch has no diff to filter on; it is a request to deploy, so
    # it gets the tests that gate the deploy.
    if: github.event_name == 'workflow_dispatch' || needs.changes.outputs.be == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    # One test run per branch at a time, so deploys leave in push order. Without
    # it two pushes test side by side, the faster one deploys first, and the
    # slower, older one then deploys over it — an older image against a database
    # the newer one already migrated. A queued run superseded by a newer push is
    # cancelled, which skips its deploy; the newer commit deploys instead.
    concurrency:
      group: booking-be-test-${{ github.ref }}
      cancel-in-progress: false

    # Throwaway. The integration harness migrates it, creates the `booking_app`
    # role and seeds both fixture tenants on every run.
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: booking_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d booking_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    # `src/env.ts` validates at import, and unit tests import it without the
    # harness — so they need a complete environment too. These are the same
    # throwaway values `stubEnvironment` in be/src/test/harness.ts fills in; the
    # harness then points DATABASE_URL / DATABASE_APP_URL at TEST_DATABASE_URL
    # itself. NODE_ENV=test is what keeps the mailer off Resend.
    env:
      TEST_DATABASE_URL: postgres://postgres:postgres@localhost:5432/booking_test
      DATABASE_URL: postgres://postgres:postgres@localhost:5432/booking_test
      DATABASE_APP_URL: postgres://booking_app:booking_app_test@localhost:5432/booking_test
      NODE_ENV: test
      APP_ENV: development
      IMPERSONATION_SECRET: test-harness-impersonation-secret-key
      BETTER_AUTH_SECRET: test-harness-better-auth-secret-key-32chars
      BETTER_AUTH_URL: http://localhost:4000
      FRONTEND_URLS: http://*.localhost:3000,http://*.portal.localhost:3001,http://localhost:3000,http://localhost:3001
      RESEND_API_KEY: re_test_harness

    defaults:
      run:
        working-directory: be

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # The same major as the image (be/Dockerfile), so a test cannot pass here on
      # a Node the server never runs on. At least 21 either way: `node --test` only
      # expands the quoted glob from 21.
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: be/package-lock.json

      # Bumping one and not the other fails here, not after the deploy.
      - name: Node matches the image
        shell: bash
        run: |
          image=$(sed -nE 's/^FROM node:([0-9]+).*/\1/p' Dockerfile | head -n1)
          ci=$(node -p 'process.versions.node.split(".")[0]')
          if [ -z "$image" ] || [ "$image" != "$ci" ]; then
            echo "::error::CI tests on Node $ci but be/Dockerfile ships Node ${image:-?}. Keep them on the same major."
            exit 1
          fi

      - run: npm ci

      # Serially, on purpose. The suite is green serially and flaky in parallel:
      # the RLS coverage test's probe table races the transfer test's table count.
      #
      # The integration tests skip themselves when TEST_DATABASE_URL is missing,
      # and a skipped test is a passing one — so a broken env here would turn the
      # gate green while testing nothing. Nothing else in the suite skips, so any
      # skip at all fails the job.
      #
      # --test-force-exit: a test file whose `after` hook throws before it
      # reaches harness.close() leaves Postgres sockets open, and the process
      # then sits at the job timeout instead of reporting the failure.
      - name: Backend tests (serial)
        shell: bash
        run: |
          node --import tsx --test --test-concurrency=1 --test-force-exit --test-reporter=tap "src/**/*.test.ts" | tee test-output.tap
          if ! grep -qx '# skipped 0' test-output.tap; then
            echo "::error::Tests were skipped — the integration suite did not run against Postgres."
            grep -E '^# (tests|pass|fail|skipped)' test-output.tap
            exit 1
          fi

  fe-client:
    needs: changes
    if: needs.changes.outputs.fe-client == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: fe-client
    steps:
      - uses: actions/checkout@v4
      # 22: the check script runs .ts through Node's own type stripping, no tsx.
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: fe-client/package-lock.json
      - run: npm ci
      - run: npm run check

  fe-portal:
    needs: changes
    if: needs.changes.outputs.fe-portal == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: fe-portal
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: fe-portal/package-lock.json
      - run: npm ci
      - run: npm run check

  deploy:
    needs: [changes, test]
    # Push or manual dispatch only — a pull request runs the tests and stops.
    # `needs: test` is the gate: a failed or skipped test job skips this one.
    if: >-
      github.event_name != 'pull_request' &&
      (github.ref_name == 'staging' || github.ref_name == 'main') &&
      (github.event_name == 'workflow_dispatch' || needs.changes.outputs.be == 'true')

    # Job-level, not workflow-level: only the deploy has to queue. At workflow
    # level every pull request's tests would wait behind a deploy, and vice versa.
    concurrency:
      # Deliberately NOT per-branch. Both stacks live on bpvps2 and share one Docker
      # daemon, so they share its containerd content store — and two `docker compose
      # up` runs pulling at once collide there:
      #
      #     unable to lease content: lease does not exist: not found
      #
      # The pull itself succeeds; compose's own re-pull is what fails, so the job
      # dies *after* migrations have run, leaving the stack on its old image with a
      # migrated database. Seen twice on 2026-09-06, both times with the `main` run
      # starting ~40s behind the `staging` one, because merging to `staging` and
      # fast-forwarding `main` fires both within a minute.
      #
      # This group was keyed on the branch so a prod deploy would never queue behind
      # a staging one. That is the right instinct for two independent targets and the
      # wrong one for two stacks on the same host: queueing is not the cost, it is
      # the fix. `cancel-in-progress: false` spares the RUNNING deploy, nothing more.
      #
      # GitHub keeps only ONE pending run per concurrency group. If a third deploy
      # queues while one runs and one waits, the waiting one is cancelled and the
      # newest takes its place, whichever branch either is on — so a `staging` push
      # can cancel a waiting `main` (production) deploy. A cancelled deploy does not
      # come back on its own: re-run it. See docs/md/deployment.md.
      group: booking-be-deploy-bpvps2
      cancel-in-progress: false

    runs-on: ubuntu-latest
    # GitHub environment names are case-sensitive: "staging" vs "Production".
    environment: ${{ github.ref_name == 'main' && 'Production' || 'staging' }}
    # Replaces the action's command_timeout: 20m. Plain ssh has no such guard,
    # and the job default is 6h -- a hung deploy would burn runner minutes.
    timeout-minutes: 25

    env:
      APP_ENV:      ${{ github.ref_name == 'main' && 'production'      || 'staging' }}
      ENV_NAME:     ${{ github.ref_name == 'main' && 'prod'            || 'staging' }}
      STACK_DIR:    ${{ github.ref_name == 'main' && 'booking-prod'    || 'booking-staging' }}
      # Full hostname — booking is on reservetoday.app, not the host-wide
      # BASE_DOMAIN (teeko.ai), so the Traefik rule takes an FQDN. One name per
      # environment: the staging backend is `api.dev`, matching the `dev` label
      # the frontends already use. The old `api.staging` alias is retired.
      #
      # The name needs its own A record at VERCEL (`vercel dns ls
      # reservetoday.app`), created BEFORE the deploy: the cert comes from
      # TLS-ALPN-01, which needs the name pointing at bpvps2 already. Vercel
      # serves a `*` ALIAS, so a missing record resolves anyway — check the
      # record exists, don't trust that the name resolves.
      BOOKING_FQDN: ${{ github.ref_name == 'main' && 'api.reservetoday.app' || 'api.dev.reservetoday.app' }}
      IMAGE_TAG:    ${{ github.ref_name == 'main' && 'latest'          || 'staging' }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ vars.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build and push BE image
        uses: docker/build-push-action@v5
        with:
          context: ./be
          push: true
          tags: |
            blueprintagency/booking-be:${{ env.IMAGE_TAG }}
            blueprintagency/booking-be:${{ github.sha }}

      - name: Connect to Tailscale
        uses: tailscale/github-action@v4
        with:
          oauth-client-id: ${{ secrets.TS_OAUTH_CLIENT_ID }}
          oauth-secret: ${{ secrets.TS_OAUTH_SECRET }}
          tags: tag:ci
          ping: ${{ vars.BPVPS2_TAILSCALE_HOST }}

      - name: Setup SSH
        run: |
          mkdir -p ~/.ssh
          echo "${{ secrets.SSH_PRIVATE_KEY }}" | tr -d '\r' > ~/.ssh/id_deploy
          chmod 600 ~/.ssh/id_deploy

      # Plain ssh, not appleboy/ssh-action. That action ships no SSH code -- it
      # curls the drone-ssh binary from GitHub release assets on every run, and
      # its cache branch is dead on an ephemeral runner. One CDN blip failed a
      # deploy before it ever reached the host (run 62, 2026-08-12). ssh is
      # already on the runner. Same pattern as infra's deploy-infra.yml.
      #
      # The script goes over as a heredoc and runs from a temp file -- NOT piped
      # to `bash -s`. `docker compose run -T` below inherits stdin and would
      # swallow the rest of this script mid-deploy; `cat` drains it first.
      # mktemp because staging and prod deploys can run at the same moment.
      - name: Deploy to bpvps2 (${{ env.STACK_DIR }})
        run: |
          ssh -i ~/.ssh/id_deploy -o StrictHostKeyChecking=accept-new -o ConnectTimeout=90 \
            "deploy@${{ vars.BPVPS2_TAILSCALE_HOST }}" \
            'umask 077; f=$(mktemp); cat > "$f" && bash "$f"; rc=$?; rm -f "$f"; exit $rc' <<'REMOTE'
            set -euo pipefail
            STACK=/root/stacks/${{ env.STACK_DIR }}
            mkdir -p "$STACK"
            cd "$STACK"

            # Per-instance compose vars. Written idempotently so the shared
            # Traefik vars already in .env (BASE_DOMAIN, ACME_EMAIL,
            # CF_DNS_API_TOKEN, TRAEFIK_DASHBOARD_AUTH) survive untouched.
            # BOOKING_HOST is dead — the router rule takes a full FQDN now.
            sed -i '/^BOOKING_HOST=/d' .env 2>/dev/null || true
            # BOOKING_FQDN_ALIAS is dead too. It was the second hostname in the
            # router rule, so a rename could overlap; the api.staging -> api.dev
            # rename it existed for is finished, and the infra repo's compose now
            # spells the rule with a single Host(). Swept out of .env for the same
            # reason as BOOKING_HOST: a key nothing reads is a key that gets read
            # back as though it meant something.
            sed -i '/^BOOKING_FQDN_ALIAS=/d' .env 2>/dev/null || true
            for kv in "ENV_NAME=${{ env.ENV_NAME }}" \
                      "BOOKING_FQDN=${{ env.BOOKING_FQDN }}" \
                      "IMAGE_TAG=${{ env.IMAGE_TAG }}"; do
              k="${kv%%=*}"
              sed -i "/^${k}=/d" .env 2>/dev/null || true
              echo "$kv" >> .env
            done

            # Backend env. DATABASE_URL is assembled from the same DB_* secrets that
            # configure the Postgres container — single source of truth.
            # db-booking is only reachable inside this instance's network.
            #
            # Required GitHub settings:
            #   org vars:    BPVPS2_TAILSCALE_HOST, DOCKERHUB_USERNAME
            #   org secrets: TS_OAUTH_CLIENT_ID, TS_OAUTH_SECRET, SSH_PRIVATE_KEY, DOCKERHUB_TOKEN
            #   env vars:    PORT, FRONTEND_URLS,
            #            PLATFORM_ADMIN_EMAIL,
            #            (optional) STRIPE_STATEMENT_DESCRIPTOR_PREFIX
            #   env secrets: DB_USER, DB_PASSWORD, DB_NAME, DB_APP_PASSWORD,
            #            IMPERSONATION_SECRET, BETTER_AUTH_SECRET, RESEND_API_KEY, RESEND_WEBHOOK_SECRET,
            #            STRIPE_SECRET_KEY, STRIPE_WEBHOOK_SECRET,
            #            R2_ACCOUNT_ID, R2_ACCESS_KEY_ID, R2_SECRET_ACCESS_KEY, R2_BUCKET_NAME, R2_PUBLIC_URL,
            #            (optional) SENTRY_DSN
            {
              # NODE_ENV stays "production" on ANY server (build flag — enables
              # optimizations + JSON logging). The environment NAME is APP_ENV.
              echo "NODE_ENV=production"
              echo "APP_ENV=${{ env.APP_ENV }}"
              echo "PORT=${{ vars.PORT }}"
              echo "TZ=Asia/Kuala_Lumpur"
              echo "DATABASE_URL=postgres://${{ secrets.DB_USER }}:${{ secrets.DB_PASSWORD }}@db-booking:5432/${{ secrets.DB_NAME }}"
              # Same database, reached as the `booking_app` role instead of the
              # owner. DATABASE_URL above is the owner and runs migrations + seeds;
              # the server runs as this one. Postgres exempts superusers and table
              # owners from Row-Level Security, so pointing the server at
              # DATABASE_URL would leave the tenant policies (migration 0033)
              # enforcing nothing while every request still succeeded.
              # `npm run db:migrate` creates the role with DB_APP_PASSWORD.
              echo "DATABASE_APP_URL=postgres://booking_app:${{ secrets.DB_APP_PASSWORD }}@db-booking:5432/${{ secrets.DB_NAME }}"
              echo "DB_APP_PASSWORD=${{ secrets.DB_APP_PASSWORD }}"
              # Who may operate the super portal (/api/v1/platform/*) — the dev
              # team, comma-separated. Deliberately not a staff role: a studio's
              # own admin must not be able to suspend another studio.
              #
              # REQUIRED. This is the whole allowlist — no studio staff account is
              # folded in. Blank means a super portal
              # nobody can reach (the backend warns at boot and refuses everyone),
              # which is the safe failure but is almost certainly not what you
              # wanted.
              echo "PLATFORM_ADMIN_EMAIL=${{ vars.PLATFORM_ADMIN_EMAIL }}"
              # Tenant subdomain origins, comma-separated, wildcard leftmost —
              # every studio is a subdomain and a studio is created by inserting
              # a row, so the allowlist has to be a pattern. Backs CORS, the
              # auth pools' trusted origins and the public-route `Origin` validation, and
              # is read backwards to build every per-studio link the backend
              # mails or redirects to.
              #
              # Required. It replaced PORTAL_ORIGIN and CLIENT_ORIGIN, which were
              # one value each for the whole platform and therefore named one
              # studio's apps to every studio's members.
              #   staging:    https://*.dev.reservetoday.app,https://*.portal.dev.reservetoday.app
              #   production: https://*.reservetoday.app,https://*.portal.reservetoday.app
              echo "FRONTEND_URLS=${{ vars.FRONTEND_URLS }}"
              # Impersonation grant signing — HS256 secret for the BE-signed JWT
              # that proves a /api/v1/me/* call is being made by a superadmin
              # impersonating a client. Must be at least 32 chars.
              echo "IMPERSONATION_SECRET=${{ secrets.IMPERSONATION_SECRET }}"
              # Better Auth (self-hosted, three pools — docs/adr/0004). The secret
              # signs sessions and encrypts 2FA secrets for all three pools; at
              # least 32 chars, and rotating it signs everyone out. The URL is
              # this backend's own origin, the base of every link Better Auth mails.
              echo "BETTER_AUTH_SECRET=${{ secrets.BETTER_AUTH_SECRET }}"
              echo "BETTER_AUTH_URL=https://${{ env.BOOKING_FQDN }}"
              # Mail — one Resend API key. The envelope address
              # (noreply@reservetoday.app) is a constant in be/src/lib/mailer.ts;
              # the studio's own name and Reply-To are per-tenant data, not env —
              # see docs/md/mail-identity.md.
              echo "RESEND_API_KEY=${{ secrets.RESEND_API_KEY }}"
              # Signs Resend's delivery/bounce/complaint webhook (#154).
              echo "RESEND_WEBHOOK_SECRET=${{ secrets.RESEND_WEBHOOK_SECRET }}"
              echo "STRIPE_SECRET_KEY=${{ secrets.STRIPE_SECRET_KEY }}"
              echo "STRIPE_WEBHOOK_SECRET=${{ secrets.STRIPE_WEBHOOK_SECRET }}"
              # Not a secret — it must match the prefix set on the Stripe account.
              echo "STRIPE_STATEMENT_DESCRIPTOR_PREFIX=${{ vars.STRIPE_STATEMENT_DESCRIPTOR_PREFIX }}"
              echo "R2_ACCOUNT_ID=${{ secrets.R2_ACCOUNT_ID }}"
              echo "R2_ACCESS_KEY_ID=${{ secrets.R2_ACCESS_KEY_ID }}"
              echo "R2_SECRET_ACCESS_KEY=${{ secrets.R2_SECRET_ACCESS_KEY }}"
              echo "R2_BUCKET_NAME=${{ secrets.R2_BUCKET_NAME }}"
              echo "R2_PUBLIC_URL=${{ secrets.R2_PUBLIC_URL }}"
              # Error monitoring (optional) — backend Sentry DSN; blank disables it
              echo "SENTRY_DSN=${{ secrets.SENTRY_DSN }}"
            } > .env.booking-be
            chmod 600 .env.booking-be
            # Postgres creds — same source as DATABASE_URL above
            {
              echo "POSTGRES_USER=${{ secrets.DB_USER }}"
              echo "POSTGRES_PASSWORD=${{ secrets.DB_PASSWORD }}"
              echo "POSTGRES_DB=${{ secrets.DB_NAME }}"
            } > .env.booking-db
            chmod 600 .env.booking-db

            docker pull blueprintagency/booking-be:${{ env.IMAGE_TAG }}

            # ── Snapshot the database this deploy is about to migrate, so a bad
            # schema change is reversible. The host's `backup` container (infra
            # repo, vps/bpvps2/stacks/backup) dumps the instance and uploads it to
            # R2 — seconds at today's size — and the snapshot is kept at least 7
            # days. Both branches: `booking-staging` holds the real member data.
            #
            # backup.sh exits 3 for a one-target run that succeeded ("green, others
            # left out"); 0 is fine too. Anything else stops the deploy HERE,
            # before a migration runs without a way back. Exit 2 includes "the
            # nightly run holds the lock" (03:30 KL, seconds): re-run the deploy.
            # Undo a migration with restore-live.sh — infra docs/backup-restore.md.
            echo "Snapshotting booking-${{ env.ENV_NAME }} before migrations ..."
            snap_rc=0
            docker exec backup /app/bin/backup.sh "booking-${{ env.ENV_NAME }}" || snap_rc=$?
            if [ "$snap_rc" != 0 ] && [ "$snap_rc" != 3 ]; then
              echo "Pre-migration snapshot FAILED (backup.sh exit $snap_rc) — not migrating."
              docker logs --tail 30 backup 2>&1 || true
              exit 1
            fi

            # Run DB migrations + seed in a SHORT-LIVED one-off container, BEFORE
            # the API server starts. Previously these ran via `docker compose exec`
            # INTO the already-running server container, so a second tsx/esbuild
            # process stacked on top of the long-running `tsx src/server.ts` and the
            # box OOM-killed the migrate step (exit 137). `compose run` brings up the
            # db dependency (waiting on its healthcheck via depends_on) but NOT the
            # server, so the migrate/seed tsx never overlaps with the server tsx.
            # Both steps are idempotent — they run on every deploy.
            docker compose run --rm -T booking-be sh -c "npm run db:migrate && npm run db:seed"

            # ── Smoke-test the freshly pulled image BEFORE recreating the live
            # container. Boot it as a throwaway on this instance's network with the
            # REAL env and probe /health (catches env/Zod failures, boot crashes, and
            # DB-connectivity breaks). If it can't come up healthy, abort NOW —
            # the currently-serving container is left untouched, so a bad build
            # never takes the API down. (Traefik 404s only when NO container is
            # running for that host; this guarantees one always is.)
            SMOKE=booking-be-smoke-${{ env.ENV_NAME }}
            echo "Smoke-testing blueprintagency/booking-be:${{ env.IMAGE_TAG }} ..."
            docker rm -f "$SMOKE" >/dev/null 2>&1 || true
            docker run -d --name "$SMOKE" \
              --env-file "$STACK/.env.booking-be" \
              --network booking-${{ env.ENV_NAME }}-network \
              blueprintagency/booking-be:${{ env.IMAGE_TAG }} >/dev/null
            smoke_ok=0
            for _ in $(seq 1 20); do
              if docker exec "$SMOKE" node -e "fetch('http://localhost:4000/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))" >/dev/null 2>&1; then
                smoke_ok=1; break
              fi
              # Bail out immediately if it already crashed (bad env / boot error).
              if [ "$(docker inspect -f '{{.State.Running}}' "$SMOKE" 2>/dev/null)" != "true" ]; then
                break
              fi
              sleep 2
            done
            if [ "$smoke_ok" != "1" ]; then
              echo "Smoke test FAILED — new image never became healthy. Recent logs:"
              docker logs --tail 80 "$SMOKE" 2>&1 || true
              docker rm -f "$SMOKE" >/dev/null 2>&1 || true
              echo "Aborting deploy — existing container left running."
              exit 1
            fi
            docker rm -f "$SMOKE" >/dev/null 2>&1 || true
            echo "Smoke test passed."

            # Recreate the API server now that the new image is verified and the
            # schema is up to date. --wait blocks until the container is HEALTHY
            # (per the compose healthcheck) so a crash-loop fails the job loudly
            # instead of silently leaving Traefik with no route (404).
            docker compose up -d --remove-orphans --wait --wait-timeout 90

            docker image prune -f
          REMOTE
