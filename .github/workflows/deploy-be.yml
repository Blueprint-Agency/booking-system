name: BE Deploy

on:
  push:
    branches: [staging]
    paths:
      - 'be/**'
      - '.github/workflows/deploy-be.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: booking-be-staging-deploy
  cancel-in-progress: false

jobs:
  deploy:
    if: github.ref_name == 'staging'
    runs-on: ubuntu-latest
    environment: staging

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ vars.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build and push BE image
        uses: docker/build-push-action@v5
        with:
          context: ./be
          push: true
          tags: |
            blueprintagency/booking-be:latest
            blueprintagency/booking-be:${{ github.sha }}

      - name: Connect to Tailscale
        uses: tailscale/github-action@v4
        with:
          oauth-client-id: ${{ secrets.TS_OAUTH_CLIENT_ID }}
          oauth-secret: ${{ secrets.TS_OAUTH_SECRET }}
          tags: tag:ci
          ping: ${{ vars.VPS3_TAILSCALE_HOST }}

      - name: Deploy to VPS3
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ vars.VPS3_TAILSCALE_HOST }}
          port: 22
          username: deploy
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          timeout: 90s
          command_timeout: 20m
          debug: true
          script: |
            set -euo pipefail
            mkdir -p /root/stacks/booking-system
            # Backend env. DATABASE_URL is assembled from the same DB_* secrets that
            # configure the Postgres container — single source of truth.
            # db-booking is only reachable inside booking-network, never exposed.
            #
            # Required GitHub repo settings:
            #   org vars:    VPS3_TAILSCALE_HOST
            #   org secrets: TS_OAUTH_CLIENT_ID, TS_OAUTH_SECRET
            #   vars:        PORT, VPS3_HOST, DOCKERHUB_USERNAME, PORTAL_ORIGIN, CLIENT_ORIGIN, SUPERADMIN_EMAIL
            #   secrets:     DB_USER, DB_PASSWORD, DB_NAME, DOCKERHUB_TOKEN, SSH_PRIVATE_KEY,
            #            CLERK_STAFF_PUBLISHABLE_KEY, CLERK_STAFF_SECRET_KEY, CLERK_STAFF_WEBHOOK_SECRET,
            #            CLERK_CLIENT_PUBLISHABLE_KEY, CLERK_CLIENT_SECRET_KEY, CLERK_CLIENT_WEBHOOK_SECRET,
            #            IMPERSONATION_SECRET,
            #            SMTP_USER, SMTP_PASSWORD,
            #            (deferred — set when next slice lands)
            #            STRIPE_SECRET_KEY, STRIPE_WEBHOOK_SECRET,
            #            R2_ACCOUNT_ID, R2_ACCESS_KEY_ID, R2_SECRET_ACCESS_KEY, R2_BUCKET_NAME, R2_PUBLIC_URL,
            #            (optional — error monitoring) SENTRY_DSN
            {
              # NODE_ENV stays "production" on ANY server (build flag — enables
              # optimizations + JSON logging). The environment NAME lives in
              # APP_ENV below.
              echo "NODE_ENV=production"
              # APP_ENV names this deployment. It's the STAGING server for now;
              # switch to "production" when the real prod server is set up.
              echo "APP_ENV=staging"
              echo "PORT=${{ vars.PORT }}"
              echo "TZ=Asia/Kuala_Lumpur"
              echo "DATABASE_URL=postgres://${{ secrets.DB_USER }}:${{ secrets.DB_PASSWORD }}@db-booking:5432/${{ secrets.DB_NAME }}"
              # Superadmin bootstrap — passwordless. Seed creates the Clerk user
              # with this email and links the staff_users row; operator picks
              # their own password via Clerk's "Forgot password" on first sign-in.
              echo "SUPERADMIN_EMAIL=${{ vars.SUPERADMIN_EMAIL }}"
              # Portal origin — used for CORS + the sign-up URL in invitation emails
              echo "PORTAL_ORIGIN=${{ vars.PORTAL_ORIGIN }}"
              # Client origin — adds fe-client to the CORS allowlist
              echo "CLIENT_ORIGIN=${{ vars.CLIENT_ORIGIN }}"
              # Clerk — staff app (admin + instructor)
              echo "CLERK_STAFF_PUBLISHABLE_KEY=${{ secrets.CLERK_STAFF_PUBLISHABLE_KEY }}"
              echo "CLERK_STAFF_SECRET_KEY=${{ secrets.CLERK_STAFF_SECRET_KEY }}"
              echo "CLERK_STAFF_WEBHOOK_SECRET=${{ secrets.CLERK_STAFF_WEBHOOK_SECRET }}"
              # Impersonation grant signing — HS256 secret for the BE-signed JWT
              # that proves a /api/v1/me/* call is being made by a superadmin
              # impersonating a client. Must be at least 32 chars.
              echo "IMPERSONATION_SECRET=${{ secrets.IMPERSONATION_SECRET }}"
              # Clerk — client app (fe-client; separate Clerk application from staff)
              echo "CLERK_CLIENT_PUBLISHABLE_KEY=${{ secrets.CLERK_CLIENT_PUBLISHABLE_KEY }}"
              echo "CLERK_CLIENT_SECRET_KEY=${{ secrets.CLERK_CLIENT_SECRET_KEY }}"
              echo "CLERK_CLIENT_WEBHOOK_SECRET=${{ secrets.CLERK_CLIENT_WEBHOOK_SECRET }}"
              # SMTP — only credentials are env. Host/port/secure/from are hardcoded
              # in be/src/lib/mailer.ts (Gmail SMTP for the life of the project).
              echo "SMTP_USER=${{ secrets.SMTP_USER }}"
              echo "SMTP_PASSWORD=${{ secrets.SMTP_PASSWORD }}"
              # Stripe (deferred — set when payments slice lands)
              echo "STRIPE_SECRET_KEY=${{ secrets.STRIPE_SECRET_KEY }}"
              echo "STRIPE_WEBHOOK_SECRET=${{ secrets.STRIPE_WEBHOOK_SECRET }}"
              # R2 (deferred — set when photo uploads slice lands)
              echo "R2_ACCOUNT_ID=${{ secrets.R2_ACCOUNT_ID }}"
              echo "R2_ACCESS_KEY_ID=${{ secrets.R2_ACCESS_KEY_ID }}"
              echo "R2_SECRET_ACCESS_KEY=${{ secrets.R2_SECRET_ACCESS_KEY }}"
              echo "R2_BUCKET_NAME=${{ secrets.R2_BUCKET_NAME }}"
              echo "R2_PUBLIC_URL=${{ secrets.R2_PUBLIC_URL }}"
              # Error monitoring (optional) — backend Sentry DSN; blank disables it
              echo "SENTRY_DSN=${{ secrets.SENTRY_DSN }}"
            } > /root/stacks/booking-system/.env.booking-be
            chmod 600 /root/stacks/booking-system/.env.booking-be
            # Postgres creds — same source as DATABASE_URL above
            {
              echo "POSTGRES_USER=${{ secrets.DB_USER }}"
              echo "POSTGRES_PASSWORD=${{ secrets.DB_PASSWORD }}"
              echo "POSTGRES_DB=${{ secrets.DB_NAME }}"
            } > /root/stacks/booking-system/.env.booking-db
            chmod 600 /root/stacks/booking-system/.env.booking-db

            docker pull blueprintagency/booking-be:latest
            cd /root/stacks/booking-system

            # Run DB migrations + seed in a SHORT-LIVED one-off container, BEFORE
            # the API server starts. Previously these ran via `docker compose exec`
            # INTO the already-running server container, so a second tsx/esbuild
            # process stacked on top of the long-running `tsx src/server.ts` and the
            # box OOM-killed the migrate step (exit 137). `compose run` brings up the
            # db dependency (waiting on its healthcheck via depends_on) but NOT the
            # server, so the migrate/seed tsx never overlaps with the server tsx.
            # Both steps are idempotent — they run on every deploy.
            docker compose run --rm -T booking-be sh -c "npm run db:migrate && npm run db:seed"

            # ── Smoke-test the freshly pulled image BEFORE recreating the live
            # container. Boot it as a throwaway on booking-network with the REAL
            # env and probe /health (catches env/Zod failures, boot crashes, and
            # DB-connectivity breaks). If it can't come up healthy, abort NOW —
            # the currently-serving booking-be is left untouched, so a bad build
            # never takes the API down. (Traefik 404s only when NO container is
            # running for the bookingapi host; this guarantees one always is.)
            echo "Smoke-testing blueprintagency/booking-be:latest ..."
            docker rm -f booking-be-smoke >/dev/null 2>&1 || true
            docker run -d --name booking-be-smoke \
              --env-file /root/stacks/booking-system/.env.booking-be \
              --network booking-network \
              blueprintagency/booking-be:latest >/dev/null
            smoke_ok=0
            for _ in $(seq 1 20); do
              if docker exec booking-be-smoke node -e "fetch('http://localhost:4000/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))" >/dev/null 2>&1; then
                smoke_ok=1; break
              fi
              # Bail out immediately if it already crashed (bad env / boot error).
              if [ "$(docker inspect -f '{{.State.Running}}' booking-be-smoke 2>/dev/null)" != "true" ]; then
                break
              fi
              sleep 2
            done
            if [ "$smoke_ok" != "1" ]; then
              echo "Smoke test FAILED — new image never became healthy. Recent logs:"
              docker logs --tail 80 booking-be-smoke 2>&1 || true
              docker rm -f booking-be-smoke >/dev/null 2>&1 || true
              echo "Aborting deploy — existing booking-be container left running."
              exit 1
            fi
            docker rm -f booking-be-smoke >/dev/null 2>&1 || true
            echo "Smoke test passed."

            # Recreate the API server now that the new image is verified and the
            # schema is up to date. --wait blocks until the container is HEALTHY
            # (per the compose healthcheck) so a crash-loop fails the job loudly
            # instead of silently leaving Traefik with no route (404).
            docker compose up -d --remove-orphans --wait --wait-timeout 90

            docker image prune -f
