name: BE Deploy

# Both instances live on bpvps2:
#   staging branch -> booking-staging stack -> api.dev.reservetoday.app
#   main   branch -> booking-prod    stack -> api.reservetoday.app
# They share nothing but Traefik — separate containers, volumes, networks and
# databases, keyed off ENV_NAME in the compose file.
#
# The deploy is gated on the backend test suite, the schema drift check and the
# browser journeys: `deploy` needs `test`, `drift` and `journeys-pr` — the
# journeys green on a stack inside the runner (e2e-local.yml) — so a red one
# never reaches either stack. The suite runs as `test-shard`, a matrix of slices
# each on its own Postgres, and `test` is the one check that sums them up (see
# `test` below). A `main` (production) deploy also needs `on-staging`: proof
# that the staging stack is already running this commit's backend. The same
# workflow runs both frontends' `check` scripts when their paths change — but
# Vercel deploys the frontends on its own and does not wait for GitHub checks,
# so for them a red check is a signal, not a gate. Pull requests into
# `staging`/`main` run every check and never deploy.
#
# It is also the one workflow a pull request runs. On top of the checks above,
# a pull request gets the test guardrails (test-guardrails.yml) and the browser
# journeys on a stack inside the runner (e2e-local.yml), both called from here
# so a PR shows one workflow, not three. Those two run on every pull request,
# whatever it touches — a check that only sometimes reports cannot be made
# required — so `pull_request` has no `paths:` filter; the `changes` job below
# still decides which of the app checks a PR needs.
#
# A merge queue (`merge_group`) runs every check a pull request runs, on the
# commit that will land, without the `changes` filter: it is the last look
# before the merge, and the queue waits on each required check (`test`,
# `guardrails / scripts`, `guardrails / e2e`) to report. It never deploys; the
# push the merge makes does, after testing it again.
on:
  push:
    branches: [staging, main]
    # A push touching only `e2e/` or the journeys' workflow still runs: it runs
    # the journeys it changed (`journeys-pr`), and every other job skips on the
    # `changes` filter below, so nothing deploys.
    paths:
      - 'be/**'
      - 'fe-client/**'
      - 'fe-portal/**'
      - 'e2e/**'
      - 'scripts/check-error-codes*'
      - '.github/workflows/deploy-be.yml'
      - '.github/workflows/e2e-local.yml'
  pull_request:
    branches: [staging, main]
  merge_group:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  # The workflow-level `paths` above only decides whether the workflow runs at
  # all. A push touching only fe-client must not build and deploy the backend,
  # so each job below checks which app actually changed.
  changes:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      # paths-filter lists a pull request's files through the API.
      pull-requests: read
    outputs:
      be: ${{ steps.filter.outputs.be }}
      fe-client: ${{ steps.filter.outputs.fe-client }}
      fe-portal: ${{ steps.filter.outputs.fe-portal }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      # Not in a merge queue, which runs every job whatever changed.
      - id: filter
        if: github.event_name != 'merge_group'
        uses: dorny/paths-filter@v3
        with:
          # Without this a push to `staging` is diffed against `main` (the default
          # branch), so every push reports `be` changed while `staging` is ahead
          # of `main` on `be/**` — and a frontend-only push redeploys the backend.
          # Naming the pushed branch diffs against the commit before the push.
          # Ignored for pull requests, which diff against their base.
          base: ${{ github.ref }}
          filters: |
            be:
              - 'be/**'
              - 'scripts/check-error-codes*'
              - '.github/workflows/deploy-be.yml'
            fe-client:
              - 'fe-client/**'
              - '.github/workflows/deploy-be.yml'
            fe-portal:
              - 'fe-portal/**'
              - '.github/workflows/deploy-be.yml'

  # The backend suite, in slices. The harness holds a Postgres advisory lock on
  # its database for a whole run, so the files cannot run side by side on one
  # database; what runs side by side is N jobs, each with a Postgres of its
  # own, each running one N-th of the file list (`SHARD=i/N`, be/scripts/
  # check.mjs: the list sorted, every N-th file). A slice is still serial, in
  # one process, so a slice is the same run as `npm run check` on fewer files.
  #
  # The slices are the one matrix list below; `strategy.job-total` hands
  # check.mjs the count, so the list cannot disagree with the denominator, and
  # check.mjs itself refuses a shard outside 1..N and checks that the N slices
  # are the whole file list, each file once. A whole run was ~7.5 minutes; six
  # slices should be about 2, most of it the fixed cost of a job (checkout,
  # npm ci, migrate and seed) rather than tests. To rebalance, edit the list.
  test-shard:
    name: test (${{ matrix.shard }}/${{ strategy.job-total }})
    needs: changes
    # A manual dispatch has no diff to filter on; it is a request to deploy, so
    # it gets the tests that gate the deploy.
    if: >-
      github.event_name == 'workflow_dispatch' || github.event_name == 'merge_group' ||
      needs.changes.outputs.be == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      # Every slice reports, so one red file does not hide what the others found.
      fail-fast: false
      matrix:
        shard: [1, 2, 3, 4, 5, 6]
    # One test run per branch and slice at a time, so deploys leave in push
    # order. Without it two pushes test side by side, the faster one deploys
    # first, and the slower, older one then deploys over it — an older image
    # against a database the newer one already migrated. A queued run superseded
    # by a newer push is cancelled, which skips its deploy; the newer commit
    # deploys instead. Keyed on the slice too, or the slices of one run would
    # queue behind each other.
    concurrency:
      group: booking-be-test-${{ github.ref }}-${{ matrix.shard }}
      cancel-in-progress: false
    permissions:
      contents: read

    # Throwaway, one per slice. The integration harness migrates it, creates the
    # `booking_app` role and seeds both fixture tenants on every run.
    services:
      postgres:
        image: postgres:16
        # No durability. The database dies with the job, so a commit need not
        # wait for fsync — Postgres documents these settings for a database that
        # can be "thrown away and recreated":
        # https://www.postgresql.org/docs/16/non-durability.html
        command: -c fsync=off -c synchronous_commit=off -c full_page_writes=off
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: booking_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d booking_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    # Only the database. The rest of the test environment — NODE_ENV=test (what
    # keeps the mailer off Resend), APP_ENV, the auth secrets, FRONTEND_URLS,
    # the two database URLs derived from this one, and no Stripe, R2 or
    # platform-admin values at all — is set by be/src/test/environment.ts, the
    # same for a local run as for this one (docs/md/testing.md § Matching CI
    # locally).
    env:
      TEST_DATABASE_URL: postgres://postgres:postgres@localhost:5432/booking_test
      SHARD: ${{ matrix.shard }}/${{ strategy.job-total }}

    defaults:
      run:
        working-directory: be

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # The Node a local run uses (.nvmrc; `engines` in be/package.json says
      # the same), checked against the image's below, so a test cannot pass here
      # on a Node the server never runs on. At least 21 either way: `node --test`
      # only expands the quoted glob from 21.
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
          cache-dependency-path: be/package-lock.json

      # Bumping .nvmrc and not be/Dockerfile, or the other way round, fails
      # here, not after the deploy.
      - name: Node matches the image
        shell: bash
        run: |
          image=$(sed -nE 's/^FROM node:([0-9]+).*/\1/p' Dockerfile | head -n1)
          ci=$(node -p 'process.versions.node.split(".")[0]')
          if [ -z "$image" ] || [ "$image" != "$ci" ]; then
            echo "::error::CI tests on Node $ci but be/Dockerfile ships Node ${image:-?}. Keep them on the same major."
            exit 1
          fi

      # The backend's error codes and the copy each frontend keeps must list the
      # same codes (be/src/shared/error-codes.ts). No dependencies, so it runs
      # before the install and fails fast.
      - name: Error catalogues match
        working-directory: .
        run: |
          node --test scripts/check-error-codes.test.mjs
          node scripts/check-error-codes.mjs

      # Proves the service container took `command:` above; a runner that
      # dropped it would still pass the suite, only slower. No dependencies, so
      # it runs before the install.
      - name: Postgres runs without fsync
        shell: bash
        run: |
          fsync=$(psql "$TEST_DATABASE_URL" -tAc 'SHOW fsync')
          echo "fsync=$fsync"
          if [ "$fsync" != "off" ]; then
            echo "::error::The test Postgres has fsync=$fsync; the service's command: was not applied."
            exit 1
          fi

      - run: npm ci

      # `npm run check`, the command a local run uses (be/scripts/check.mjs), so
      # the two cannot drift apart; SHARD (env above) picks this job's slice of
      # the file list. It runs serially, in one process, on purpose. Serially
      # because the suite is flaky in parallel: the RLS coverage test's probe
      # table races the transfer test's table count. In one process
      # (--experimental-test-isolation=none, Node 22's spelling) because a
      # process per file imports the app and sets up the database once per
      # file, which was most of this step's time. Its --import of
      # src/test/environment.ts puts the test environment in place before any
      # file loads (docs/md/testing.md § Running the backend tests), and its
      # --test-force-exit keeps a test file whose `after` hook throws before
      # harness.close() from leaving Postgres sockets open and the job sitting
      # at its timeout.
      #
      # check.mjs refuses to start without TEST_DATABASE_URL, so the suite
      # cannot skip itself green; a skip that remains is a `test.skip` someone
      # wrote, and it fails the job. Every slice makes this check, so across
      # the shards together nothing skipped. The job is stateless: it records
      # nothing for a later run and reads nothing from an earlier one. Coverage
      # runs nightly instead (be-coverage.yml), off the path every push waits on.
      - name: Backend tests (serial, this shard)
        shell: bash
        run: |
          npm run -s check -- --test-reporter=tap --test-reporter-destination=stdout | tee test-output.tap
          if ! grep -qx '# skipped 0' test-output.tap; then
            echo "::error::Tests were skipped. A skipped test proves nothing: fix it or delete it."
            grep -E '^# (tests|pass|fail|skipped)' test-output.tap
            exit 1
          fi

  # The one check for the whole suite: green when every slice of `test-shard`
  # is. It exists so `deploy` can need `test` and branch protection and the merge
  # queue can require a check named `test`, as before the suite was sliced —
  # a matrix job reports one check per slice, and a required check that is
  # sometimes skipped would be waved through. It runs whenever the slices did
  # (same condition), fails when any of them failed or was cancelled, and is
  # skipped with them when the backend did not change, which `deploy` already
  # reads as no deploy.
  test:
    needs: [changes, test-shard]
    if: >-
      !cancelled() &&
      (github.event_name == 'workflow_dispatch' || github.event_name == 'merge_group' ||
      needs.changes.outputs.be == 'true')
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Every shard passed
        run: |
          echo "test-shard: ${{ needs.test-shard.result }}"
          [ "${{ needs.test-shard.result }}" = success ]

  # The schema in `be/src/db/schema/` and the migration history must describe the
  # same database. A schema edit committed without its migration passes every
  # test — the harness migrates, and the code that reads the new column simply
  # is not exercised — and then fails in production against a table that lacks it.
  #
  # Two halves. Migrating an empty Postgres proves every migration still applies
  # from nothing. `db:generate` is drizzle's drift check: it diffs the schema
  # against the latest migration snapshot and must find nothing to write.
  #
  # Not `drizzle-kit push` against the migrated database, which looks like the
  # more direct comparison. It reports ~150 differences on a clean branch —
  # the RLS policies migrate.ts adds, expression indexes, foreign-key names
  # Postgres truncates at 63 characters — so a real drift would be lost in it.
  drift:
    needs: changes
    if: >-
      github.event_name == 'workflow_dispatch' || github.event_name == 'merge_group' ||
      needs.changes.outputs.be == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 10

    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: booking_drift
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d booking_drift"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    env:
      DATABASE_URL: postgres://postgres:postgres@localhost:5432/booking_drift

    defaults:
      run:
        working-directory: be

    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: be/package-lock.json
      - run: npm ci

      - name: Every migration applies to an empty database
        run: npm run db:migrate

      # Read the words, not the exit code. drizzle-kit exits 0 when it writes a
      # new migration, and 0 again when it crashes on a rename it wanted to ask
      # about (no TTY here to ask on) — so only its "nothing to migrate" line,
      # plus an untouched migrations folder, counts as green.
      - name: Schema matches the migrations
        shell: bash
        run: |
          npm run db:generate < /dev/null 2>&1 | tee drift-output.txt || true
          dirty=$(git status --porcelain -- 'src/db/migrations/*.sql' src/db/migrations/meta)
          if ! grep -q 'No schema changes, nothing to migrate' drift-output.txt || [ -n "$dirty" ]; then
            echo "::error::src/db/schema/ has changes no migration describes. Run \`npm run db:generate\` in be/, review the SQL, and commit it. See be/src/db/migrations/README.md."
            [ -n "$dirty" ] && echo "$dirty"
            exit 1
          fi

  fe-client:
    needs: changes
    if: github.event_name == 'merge_group' || needs.changes.outputs.fe-client == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: fe-client
    steps:
      - uses: actions/checkout@v4
      # 22: the check script runs .ts through Node's own type stripping, no tsx.
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: fe-client/package-lock.json
      - run: npm ci
      - run: npm run check
      # A frontend-only change skips the backend `test` job, so its copy of the
      # error catalogue is checked here too.
      - name: Error catalogues match
        working-directory: .
        run: node scripts/check-error-codes.mjs

  fe-portal:
    needs: changes
    if: github.event_name == 'merge_group' || needs.changes.outputs.fe-portal == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: fe-portal
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: fe-portal/package-lock.json
      - run: npm ci
      - run: npm run check
      - name: Error catalogues match
        working-directory: .
        run: node scripts/check-error-codes.mjs

  # The checks that keep tests honest (#200). Pull requests and the merge queue.
  guardrails:
    if: github.event_name == 'pull_request' || github.event_name == 'merge_group'
    permissions:
      contents: read
    uses: ./.github/workflows/test-guardrails.yml

  # The browser journeys on a stack inside the runner (#207): on every pull
  # request, in the merge queue, and before every deploy, `staging` and `main`
  # alike — the same job, the same stack, the same journeys. They touch nothing
  # outside the runner, so they can gate both stacks; running them against the
  # deployed staging stack instead (the old `e2e` job, e2e.yml) gated production
  # on staging's network, Vercel builds and DNS, and failed about one `main`
  # push in five on 120 s timeouts that no commit had caused. No `if:` — every
  # event this workflow has runs them. The job keeps its name so branch
  # protection's required check still matches.
  journeys-pr:
    permissions:
      contents: read
    uses: ./.github/workflows/e2e-local.yml

  # Before a PRODUCTION deploy only: the staging stack must already be running
  # this commit's backend. Green journeys in the runner say the commit works;
  # this says it has also been deployed, migrated and smoke-tested once, on
  # staging, before production gets it. A commit that skipped `staging`, or
  # whose staging deploy failed and left the old image serving, is refused here.
  on-staging:
    needs: changes
    if: >-
      github.ref_name == 'main' &&
      (github.event_name == 'workflow_dispatch' || needs.changes.outputs.be == 'true')
    runs-on: ubuntu-latest
    # The wait below can take 30 minutes on its own.
    timeout-minutes: 40
    permissions:
      contents: read
      # To see whether a staging deploy is still running.
      actions: read
    steps:
      - uses: actions/checkout@v4
        with:
          # Full history, to compare staging's running build with this commit.
          fetch-depth: 0

      # Merging to `staging` and fast-forwarding `main` fires the staging deploy
      # and this run within a minute of each other. Read staging's image only
      # once that deploy has finished, or this would compare against the build
      # it is about to replace.
      - name: Wait for any staging deploy to finish
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          for _ in $(seq 1 60); do
            busy=$(gh run list -R "$GITHUB_REPOSITORY" --workflow deploy-be.yml --branch staging \
              --json status --jq '[.[] | select(.status != "completed")] | length')
            [ "$busy" = "0" ] && exit 0
            echo "A staging deploy is still running — waiting…"
            sleep 30
          done
          echo "::error::A staging deploy has been running for 30 minutes; not deploying to production over it."
          exit 1

      # Staging's running image is named in its stack's .env on bpvps2, reached
      # the same way the deploy reaches it.
      - name: Connect to Tailscale
        uses: tailscale/github-action@v4
        with:
          oauth-client-id: ${{ secrets.TS_OAUTH_CLIENT_ID }}
          oauth-secret: ${{ secrets.TS_OAUTH_SECRET }}
          tags: tag:ci
          ping: ${{ vars.BPVPS2_TAILSCALE_HOST }}

      - name: Setup SSH
        run: |
          mkdir -p ~/.ssh
          echo "${{ secrets.SSH_PRIVATE_KEY }}" | tr -d '\r' > ~/.ssh/id_deploy
          chmod 600 ~/.ssh/id_deploy

      # Compared on `be/` rather than by sha: a later frontend-only commit does
      # not redeploy the backend, and should not have to.
      - name: Staging runs this commit's backend
        shell: bash
        run: |
          staging=$(ssh -i ~/.ssh/id_deploy -o StrictHostKeyChecking=accept-new "deploy@${{ vars.BPVPS2_TAILSCALE_HOST }}" \
            "sed -n 's/^IMAGE_TAG=//p' /root/stacks/booking-staging/.env | tail -n1")
          echo "Staging runs: ${staging:-?}   This run: ${{ github.sha }}"
          if ! git cat-file -e "${staging}^{commit}" 2>/dev/null; then
            echo "::error::Staging runs '${staging:-nothing}', which is not a commit in this repository. Deploy this commit to staging first."
            exit 1
          fi
          if ! git diff --quiet "$staging" "${{ github.sha }}" -- be/; then
            echo "::error::Staging's backend ($staging) is not this commit's. Deploy it to staging first, then re-run."
            git diff --stat "$staging" "${{ github.sha }}" -- be/ | tail -n 5
            exit 1
          fi

  deploy:
    needs: [changes, test, drift, journeys-pr, on-staging]
    # Push or manual dispatch only — a pull request runs the tests and stops.
    #
    # The gate: `test`, `drift` and the in-runner journeys (`journeys-pr`) must
    # pass on both branches, and on `main` so must `on-staging`. Its result is
    # spelled out because it is *skipped* on `staging`, and a skipped need would
    # otherwise skip this job too; `!cancelled()` is what lets the condition be
    # read at all once a need was skipped. A failed or skipped `on-staging` on
    # `main` still skips the production deploy.
    if: >-
      !cancelled() &&
      needs.test.result == 'success' &&
      needs.drift.result == 'success' &&
      needs.journeys-pr.result == 'success' &&
      (needs.on-staging.result == 'success' || (github.ref_name != 'main' && needs.on-staging.result == 'skipped')) &&
      github.event_name != 'pull_request' &&
      (github.ref_name == 'staging' || github.ref_name == 'main') &&
      (github.event_name == 'workflow_dispatch' || needs.changes.outputs.be == 'true')

    # Job-level, not workflow-level: only the deploy has to queue. At workflow
    # level every pull request's tests would wait behind a deploy, and vice versa.
    concurrency:
      # Deliberately NOT per-branch. Both stacks live on bpvps2 and share one Docker
      # daemon, so they share its containerd content store — and two `docker compose
      # up` runs pulling at once collide there:
      #
      #     unable to lease content: lease does not exist: not found
      #
      # The pull itself succeeds; compose's own re-pull is what fails, so the job
      # dies *after* migrations have run, leaving the stack on its old image with a
      # migrated database. Seen twice on 2026-09-06, both times with the `main` run
      # starting ~40s behind the `staging` one, because merging to `staging` and
      # fast-forwarding `main` fires both within a minute.
      #
      # This group was keyed on the branch so a prod deploy would never queue behind
      # a staging one. That is the right instinct for two independent targets and the
      # wrong one for two stacks on the same host: queueing is not the cost, it is
      # the fix. `cancel-in-progress: false` spares the RUNNING deploy, nothing more.
      #
      # GitHub keeps only ONE pending run per concurrency group. If a third deploy
      # queues while one runs and one waits, the waiting one is cancelled and the
      # newest takes its place, whichever branch either is on — so a `staging` push
      # can cancel a waiting `main` (production) deploy. A cancelled deploy does not
      # come back on its own: re-run it. See docs/md/deployment.md.
      group: booking-be-deploy-bpvps2
      cancel-in-progress: false

    runs-on: ubuntu-latest
    # GitHub environment names are case-sensitive: "staging" vs "Production".
    environment: ${{ github.ref_name == 'main' && 'Production' || 'staging' }}
    # Replaces the action's command_timeout: 20m. Plain ssh has no such guard,
    # and the job default is 6h -- a hung deploy would burn runner minutes.
    timeout-minutes: 25

    env:
      APP_ENV:      ${{ github.ref_name == 'main' && 'production'      || 'staging' }}
      ENV_NAME:     ${{ github.ref_name == 'main' && 'prod'            || 'staging' }}
      STACK_DIR:    ${{ github.ref_name == 'main' && 'booking-prod'    || 'booking-staging' }}
      # Full hostname — booking is on reservetoday.app, not the host-wide
      # BASE_DOMAIN (teeko.ai), so the Traefik rule takes an FQDN. One name per
      # environment: the staging backend is `api.dev`, matching the `dev` label
      # the frontends already use. The old `api.staging` alias is retired.
      #
      # The name needs its own A record at VERCEL (`vercel dns ls
      # reservetoday.app`), created BEFORE the deploy: the cert comes from
      # TLS-ALPN-01, which needs the name pointing at bpvps2 already. Vercel
      # serves a `*` ALIAS, so a missing record resolves anyway — check the
      # record exists, don't trust that the name resolves.
      BOOKING_FQDN: ${{ github.ref_name == 'main' && 'api.reservetoday.app' || 'api.dev.reservetoday.app' }}
      IMAGE_TAG:    ${{ github.ref_name == 'main' && 'latest'          || 'staging' }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ vars.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build and push BE image
        uses: docker/build-push-action@v5
        with:
          context: ./be
          push: true
          tags: |
            blueprintagency/booking-be:${{ env.IMAGE_TAG }}
            blueprintagency/booking-be:${{ github.sha }}

      - name: Connect to Tailscale
        uses: tailscale/github-action@v4
        with:
          oauth-client-id: ${{ secrets.TS_OAUTH_CLIENT_ID }}
          oauth-secret: ${{ secrets.TS_OAUTH_SECRET }}
          tags: tag:ci
          ping: ${{ vars.BPVPS2_TAILSCALE_HOST }}

      - name: Setup SSH
        run: |
          mkdir -p ~/.ssh
          echo "${{ secrets.SSH_PRIVATE_KEY }}" | tr -d '\r' > ~/.ssh/id_deploy
          chmod 600 ~/.ssh/id_deploy

      # Plain ssh, not appleboy/ssh-action. That action ships no SSH code -- it
      # curls the drone-ssh binary from GitHub release assets on every run, and
      # its cache branch is dead on an ephemeral runner. One CDN blip failed a
      # deploy before it ever reached the host (run 62, 2026-08-12). ssh is
      # already on the runner. Same pattern as infra's deploy-infra.yml.
      #
      # The script goes over as a heredoc and runs from a temp file -- NOT piped
      # to `bash -s`. `docker compose run -T` below inherits stdin and would
      # swallow the rest of this script mid-deploy; `cat` drains it first.
      # mktemp because staging and prod deploys can run at the same moment.
      - name: Deploy to bpvps2 (${{ env.STACK_DIR }})
        run: |
          ssh -i ~/.ssh/id_deploy -o StrictHostKeyChecking=accept-new -o ConnectTimeout=90 \
            "deploy@${{ vars.BPVPS2_TAILSCALE_HOST }}" \
            'umask 077; f=$(mktemp); cat > "$f" && bash "$f"; rc=$?; rm -f "$f"; exit $rc' <<'REMOTE'
            set -euo pipefail
            STACK=/root/stacks/${{ env.STACK_DIR }}
            mkdir -p "$STACK"
            cd "$STACK"

            # Per-instance compose vars. Written idempotently so the shared
            # Traefik vars already in .env (BASE_DOMAIN, ACME_EMAIL,
            # CF_DNS_API_TOKEN, TRAEFIK_DASHBOARD_AUTH) survive untouched.
            # BOOKING_HOST is dead — the router rule takes a full FQDN now.
            sed -i '/^BOOKING_HOST=/d' .env 2>/dev/null || true
            # BOOKING_FQDN_ALIAS is dead too. It was the second hostname in the
            # router rule, so a rename could overlap; the api.staging -> api.dev
            # rename it existed for is finished, and the infra repo's compose now
            # spells the rule with a single Host(). Swept out of .env for the same
            # reason as BOOKING_HOST: a key nothing reads is a key that gets read
            # back as though it meant something.
            sed -i '/^BOOKING_FQDN_ALIAS=/d' .env 2>/dev/null || true
            # IMAGE_TAG is written further down, once the new image has passed
            # its smoke test.
            for kv in "ENV_NAME=${{ env.ENV_NAME }}" \
                      "BOOKING_FQDN=${{ env.BOOKING_FQDN }}"; do
              k="${kv%%=*}"
              sed -i "/^${k}=/d" .env 2>/dev/null || true
              echo "$kv" >> .env
            done
            # The image this deploy ships, by commit — the floating tag moves.
            NEW_TAG=${{ github.sha }}

            # Backend env. DATABASE_URL is assembled from the same DB_* secrets that
            # configure the Postgres container — single source of truth.
            # db-booking is only reachable inside this instance's network.
            #
            # Required GitHub settings:
            #   org vars:    BPVPS2_TAILSCALE_HOST, DOCKERHUB_USERNAME
            #   org secrets: TS_OAUTH_CLIENT_ID, TS_OAUTH_SECRET, SSH_PRIVATE_KEY, DOCKERHUB_TOKEN
            #   env vars:    PORT, FRONTEND_URLS,
            #            PLATFORM_ADMIN_EMAIL,
            #            (optional) LOG_LEVEL
            #   env secrets: DB_USER, DB_PASSWORD, DB_NAME, DB_APP_PASSWORD,
            #            IMPERSONATION_SECRET, BETTER_AUTH_SECRET, RESEND_API_KEY, RESEND_WEBHOOK_SECRET,
            #            PAYMENT_CREDENTIALS_KEY,
            #            R2_ACCOUNT_ID, R2_ACCESS_KEY_ID, R2_SECRET_ACCESS_KEY, R2_BUCKET_NAME, R2_PUBLIC_URL
            # Required (#293): every studio takes payments on its own Stripe
            # account, and this key is what its credentials are sealed with.
            # Unset, no studio's credentials can be stored or opened, so no
            # studio can take an online payment — refused here rather than
            # discovered at a member's checkout.
            if [ -z "${{ secrets.PAYMENT_CREDENTIALS_KEY }}" ]; then
              echo "PAYMENT_CREDENTIALS_KEY is not set in this GitHub Environment; no studio could take an online payment. Set it (openssl rand -base64 32) and redeploy." >&2
              exit 1
            fi
            {
              # NODE_ENV stays "production" on ANY server (build flag — enables
              # optimizations + JSON logging). The environment NAME is APP_ENV.
              echo "NODE_ENV=production"
              echo "APP_ENV=${{ env.APP_ENV }}"
              echo "PORT=${{ vars.PORT }}"
              # Pino level; optional, blank means `info` (src/shared/logger.ts).
              echo "LOG_LEVEL=${{ vars.LOG_LEVEL }}"
              echo "TZ=Asia/Kuala_Lumpur"
              echo "DATABASE_URL=postgres://${{ secrets.DB_USER }}:${{ secrets.DB_PASSWORD }}@db-booking:5432/${{ secrets.DB_NAME }}"
              # Same database, reached as the `booking_app` role instead of the
              # owner. DATABASE_URL above is the owner and runs migrations + seeds;
              # the server runs as this one. Postgres exempts superusers and table
              # owners from Row-Level Security, so pointing the server at
              # DATABASE_URL would leave the tenant policies (migration 0033)
              # enforcing nothing while every request still succeeded.
              # `npm run db:migrate` creates the role with DB_APP_PASSWORD.
              echo "DATABASE_APP_URL=postgres://booking_app:${{ secrets.DB_APP_PASSWORD }}@db-booking:5432/${{ secrets.DB_NAME }}"
              echo "DB_APP_PASSWORD=${{ secrets.DB_APP_PASSWORD }}"
              # Who may operate the super portal (/api/v1/platform/*) — the dev
              # team, comma-separated. Deliberately not a staff role: a studio's
              # own admin must not be able to suspend another studio.
              #
              # REQUIRED. This is the whole allowlist — no studio staff account is
              # folded in. Blank means a super portal
              # nobody can reach (the backend warns at boot and refuses everyone),
              # which is the safe failure but is almost certainly not what you
              # wanted.
              echo "PLATFORM_ADMIN_EMAIL=${{ vars.PLATFORM_ADMIN_EMAIL }}"
              # Tenant subdomain origins, comma-separated, wildcard leftmost —
              # every studio is a subdomain and a studio is created by inserting
              # a row, so the allowlist has to be a pattern. Backs CORS, the
              # auth pools' trusted origins and the public-route `Origin` validation, and
              # is read backwards to build every per-studio link the backend
              # mails or redirects to.
              #
              # Required. It replaced PORTAL_ORIGIN and CLIENT_ORIGIN, which were
              # one value each for the whole platform and therefore named one
              # studio's apps to every studio's members.
              #   staging:    https://*.dev.reservetoday.app,https://*.portal.dev.reservetoday.app
              #   production: https://*.reservetoday.app,https://*.portal.reservetoday.app
              echo "FRONTEND_URLS=${{ vars.FRONTEND_URLS }}"
              # Impersonation grant signing — HS256 secret for the BE-signed JWT
              # that proves a /api/v1/me/* call is being made by a superadmin
              # impersonating a client. Must be at least 32 chars.
              echo "IMPERSONATION_SECRET=${{ secrets.IMPERSONATION_SECRET }}"
              # Better Auth (self-hosted, three pools — docs/adr/0004). The secret
              # signs sessions and encrypts 2FA secrets for all three pools; at
              # least 32 chars, and rotating it signs everyone out. The URL is
              # this backend's own origin, the base of every link Better Auth mails.
              echo "BETTER_AUTH_SECRET=${{ secrets.BETTER_AUTH_SECRET }}"
              echo "BETTER_AUTH_URL=https://${{ env.BOOKING_FQDN }}"
              # Mail — one Resend API key. The envelope address
              # (noreply@reservetoday.app) is a constant in be/src/lib/mailer.ts;
              # the studio's own name and Reply-To are per-tenant data, not env —
              # see docs/md/mail-identity.md.
              echo "RESEND_API_KEY=${{ secrets.RESEND_API_KEY }}"
              # Signs Resend's delivery/bounce/complaint webhook (#154).
              echo "RESEND_WEBHOOK_SECRET=${{ secrets.RESEND_WEBHOOK_SECRET }}"
              # STRIPE_API_URL is deliberately never written: a deployment reaches
              # Stripe itself. It points the pull-request journeys at a stand-in
              # (e2e-local.yml), and production refuses it at boot.
              # Seals each studio's OWN payment credentials at rest (#100) —
              # the only Stripe setting there is: the platform account's key,
              # webhook secret and descriptor prefix are gone (#293).
              # Rotating it orphans every stored credential — they have to be
              # re-entered per studio — so it is set once and left alone.
              echo "PAYMENT_CREDENTIALS_KEY=${{ secrets.PAYMENT_CREDENTIALS_KEY }}"
              echo "R2_ACCOUNT_ID=${{ secrets.R2_ACCOUNT_ID }}"
              echo "R2_ACCESS_KEY_ID=${{ secrets.R2_ACCESS_KEY_ID }}"
              echo "R2_SECRET_ACCESS_KEY=${{ secrets.R2_SECRET_ACCESS_KEY }}"
              echo "R2_BUCKET_NAME=${{ secrets.R2_BUCKET_NAME }}"
              echo "R2_PUBLIC_URL=${{ secrets.R2_PUBLIC_URL }}"
            } > .env.booking-be
            chmod 600 .env.booking-be
            # Postgres creds — same source as DATABASE_URL above
            {
              echo "POSTGRES_USER=${{ secrets.DB_USER }}"
              echo "POSTGRES_PASSWORD=${{ secrets.DB_PASSWORD }}"
              echo "POSTGRES_DB=${{ secrets.DB_NAME }}"
            } > .env.booking-db
            chmod 600 .env.booking-db

            docker pull "blueprintagency/booking-be:$NEW_TAG"

            # ── Snapshot the database this deploy is about to migrate, so a bad
            # schema change is reversible. The host's `backup` container (infra
            # repo, vps/bpvps2/stacks/backup) dumps the instance and uploads it to
            # R2 — seconds at today's size — and the snapshot is kept at least 7
            # days. Both branches: `booking-staging` holds the real member data.
            #
            # backup.sh exits 3 for a one-target run that succeeded ("green, others
            # left out"); 0 is fine too. Anything else stops the deploy HERE,
            # before a migration runs without a way back. Exit 2 includes "the
            # nightly run holds the lock" (03:30 KL, seconds): re-run the deploy.
            # Undo a migration with restore-live.sh — infra docs/backup-restore.md.
            echo "Snapshotting booking-${{ env.ENV_NAME }} before migrations ..."
            snap_rc=0
            docker exec backup /app/bin/backup.sh "booking-${{ env.ENV_NAME }}" || snap_rc=$?
            if [ "$snap_rc" != 0 ] && [ "$snap_rc" != 3 ]; then
              echo "Pre-migration snapshot FAILED (backup.sh exit $snap_rc) — not migrating."
              docker logs --tail 30 backup 2>&1 || true
              exit 1
            fi

            # Run DB migrations + seed in a SHORT-LIVED one-off container, BEFORE
            # the API server starts. Previously these ran via `docker compose exec`
            # INTO the already-running server container, so a second tsx/esbuild
            # process stacked on top of the long-running `tsx src/server.ts` and the
            # box OOM-killed the migrate step (exit 137). `compose run` brings up the
            # db dependency (waiting on its healthcheck via depends_on) but NOT the
            # server, so the migrate/seed tsx never overlaps with the server tsx.
            # Both steps are idempotent — they run on every deploy.
            # IMAGE_TAG from the shell, which compose prefers over .env: the new
            # image's migrations, while .env still names the image serving now.
            IMAGE_TAG="$NEW_TAG" docker compose run --rm -T booking-be sh -c "npm run db:migrate && npm run db:seed"

            # ── Smoke-test the freshly pulled image BEFORE recreating the live
            # container. Boot it as a throwaway on this instance's network with the
            # REAL env and probe /health (catches env/Zod failures, boot crashes, and
            # DB-connectivity breaks). If it can't come up healthy, abort NOW —
            # the currently-serving container is left untouched, so a bad build
            # never takes the API down. (Traefik 404s only when NO container is
            # running for that host; this guarantees one always is.)
            SMOKE=booking-be-smoke-${{ env.ENV_NAME }}
            echo "Smoke-testing blueprintagency/booking-be:$NEW_TAG ..."
            docker rm -f "$SMOKE" >/dev/null 2>&1 || true
            docker run -d --name "$SMOKE" \
              --env-file "$STACK/.env.booking-be" \
              --network booking-${{ env.ENV_NAME }}-network \
              "blueprintagency/booking-be:$NEW_TAG" >/dev/null
            smoke_ok=0
            for _ in $(seq 1 20); do
              if docker exec "$SMOKE" node -e "fetch('http://localhost:4000/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))" >/dev/null 2>&1; then
                smoke_ok=1; break
              fi
              # Bail out immediately if it already crashed (bad env / boot error).
              if [ "$(docker inspect -f '{{.State.Running}}' "$SMOKE" 2>/dev/null)" != "true" ]; then
                break
              fi
              sleep 2
            done
            if [ "$smoke_ok" != "1" ]; then
              echo "Smoke test FAILED — new image never became healthy. Recent logs:"
              docker logs --tail 80 "$SMOKE" 2>&1 || true
              docker rm -f "$SMOKE" >/dev/null 2>&1 || true
              echo "Aborting deploy — existing container left running."
              exit 1
            fi
            docker rm -f "$SMOKE" >/dev/null 2>&1 || true
            echo "Smoke test passed."

            # ── Point the stack at the new image by sha, and keep the sha it
            # replaces as PREVIOUS_IMAGE_TAG. Rolling back is then one edit: swap
            # the two values, `docker compose up -d` (docs/md/deployment.md §
            # Rolling back). A floating tag cannot be rolled back to — it already
            # names the build being rolled back from. Written only after the smoke
            # test, so a build that never served cannot become "previous"; and a
            # re-run of the same sha leaves PREVIOUS alone rather than making the
            # two equal. The first deploy after this change records the floating
            # tag the stack was on as PREVIOUS — not a sha, and not a way back.
            current_tag=$(sed -n 's/^IMAGE_TAG=//p' .env | tail -n1)
            if [ -n "$current_tag" ] && [ "$current_tag" != "$NEW_TAG" ]; then
              sed -i '/^PREVIOUS_IMAGE_TAG=/d' .env
              echo "PREVIOUS_IMAGE_TAG=$current_tag" >> .env
            fi
            sed -i '/^IMAGE_TAG=/d' .env
            echo "IMAGE_TAG=$NEW_TAG" >> .env
            echo "IMAGE_TAG=$NEW_TAG  PREVIOUS_IMAGE_TAG=$(sed -n 's/^PREVIOUS_IMAGE_TAG=//p' .env)"

            # Recreate the API server now that the new image is verified and the
            # schema is up to date. --wait blocks until the container is HEALTHY
            # (per the compose healthcheck) so a crash-loop fails the job loudly
            # instead of silently leaving Traefik with no route (404).
            docker compose up -d --remove-orphans --wait --wait-timeout 90

            docker image prune -f
          REMOTE
