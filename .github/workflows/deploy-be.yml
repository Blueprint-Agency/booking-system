name: BE Deploy

on:
  push:
    branches: [main]
    paths:
      - 'be/**'
      - '.github/workflows/deploy-be.yml'
  workflow_dispatch:

jobs:
  deploy:
    if: github.ref_name == 'main'
    runs-on: ubuntu-latest
    environment: production

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ vars.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build and push BE image
        uses: docker/build-push-action@v5
        with:
          context: ./be
          push: true
          tags: |
            blueprintagency/booking-be:latest
            blueprintagency/booking-be:${{ github.sha }}

      # Deploy is retried up to 3 times to absorb intermittent SSH handshake
      # timeouts at the Hostinger edge (GHA runner IPs occasionally get dropped
      # by upstream brute-force filters). Script is identical across attempts;
      # migrate + seed are idempotent so retrying after a partial run is safe.
      #
      # Required GitHub repo settings:
      #   vars:    PORT, VPS3_HOST, DOCKERHUB_USERNAME, PORTAL_ORIGIN, CLIENT_ORIGIN, SUPERADMIN_EMAIL
      #   secrets: DB_USER, DB_PASSWORD, DB_NAME, DOCKERHUB_TOKEN, SSH_PRIVATE_KEY,
      #            CLERK_STAFF_PUBLISHABLE_KEY, CLERK_STAFF_SECRET_KEY, CLERK_STAFF_WEBHOOK_SECRET,
      #            CLERK_CLIENT_PUBLISHABLE_KEY, CLERK_CLIENT_SECRET_KEY, CLERK_CLIENT_WEBHOOK_SECRET,
      #            IMPERSONATION_SECRET,
      #            SMTP_USER, SMTP_PASSWORD,
      #            (deferred — set when next slice lands)
      #            STRIPE_SECRET_KEY, STRIPE_WEBHOOK_SECRET,
      #            R2_ACCOUNT_ID, R2_ACCESS_KEY_ID, R2_SECRET_ACCESS_KEY, R2_BUCKET_NAME, R2_PUBLIC_URL
      - name: Deploy to VPS3 (attempt 1)
        id: deploy1
        continue-on-error: true
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ vars.VPS3_HOST }}
          username: deploy
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          timeout: 60s
          script: |
            set -euo pipefail
            mkdir -p /root/stacks/booking-system
            {
              echo "NODE_ENV=production"
              echo "PORT=${{ vars.PORT }}"
              echo "TZ=Asia/Kuala_Lumpur"
              echo "DATABASE_URL=postgres://${{ secrets.DB_USER }}:${{ secrets.DB_PASSWORD }}@db-booking:5432/${{ secrets.DB_NAME }}"
              echo "SUPERADMIN_EMAIL=${{ vars.SUPERADMIN_EMAIL }}"
              echo "PORTAL_ORIGIN=${{ vars.PORTAL_ORIGIN }}"
              echo "CLIENT_ORIGIN=${{ vars.CLIENT_ORIGIN }}"
              echo "CLERK_STAFF_PUBLISHABLE_KEY=${{ secrets.CLERK_STAFF_PUBLISHABLE_KEY }}"
              echo "CLERK_STAFF_SECRET_KEY=${{ secrets.CLERK_STAFF_SECRET_KEY }}"
              echo "CLERK_STAFF_WEBHOOK_SECRET=${{ secrets.CLERK_STAFF_WEBHOOK_SECRET }}"
              echo "IMPERSONATION_SECRET=${{ secrets.IMPERSONATION_SECRET }}"
              echo "CLERK_CLIENT_PUBLISHABLE_KEY=${{ secrets.CLERK_CLIENT_PUBLISHABLE_KEY }}"
              echo "CLERK_CLIENT_SECRET_KEY=${{ secrets.CLERK_CLIENT_SECRET_KEY }}"
              echo "CLERK_CLIENT_WEBHOOK_SECRET=${{ secrets.CLERK_CLIENT_WEBHOOK_SECRET }}"
              echo "SMTP_USER=${{ secrets.SMTP_USER }}"
              echo "SMTP_PASSWORD=${{ secrets.SMTP_PASSWORD }}"
              echo "STRIPE_SECRET_KEY=${{ secrets.STRIPE_SECRET_KEY }}"
              echo "STRIPE_WEBHOOK_SECRET=${{ secrets.STRIPE_WEBHOOK_SECRET }}"
              echo "R2_ACCOUNT_ID=${{ secrets.R2_ACCOUNT_ID }}"
              echo "R2_ACCESS_KEY_ID=${{ secrets.R2_ACCESS_KEY_ID }}"
              echo "R2_SECRET_ACCESS_KEY=${{ secrets.R2_SECRET_ACCESS_KEY }}"
              echo "R2_BUCKET_NAME=${{ secrets.R2_BUCKET_NAME }}"
              echo "R2_PUBLIC_URL=${{ secrets.R2_PUBLIC_URL }}"
            } > /root/stacks/booking-system/.env.booking-be
            chmod 600 /root/stacks/booking-system/.env.booking-be
            {
              echo "POSTGRES_USER=${{ secrets.DB_USER }}"
              echo "POSTGRES_PASSWORD=${{ secrets.DB_PASSWORD }}"
              echo "POSTGRES_DB=${{ secrets.DB_NAME }}"
            } > /root/stacks/booking-system/.env.booking-db
            chmod 600 /root/stacks/booking-system/.env.booking-db

            docker pull blueprintagency/booking-be:latest
            cd /root/stacks/booking-system
            docker compose up -d --remove-orphans

            for i in $(seq 1 30); do
              if [ "$(docker inspect -f '{{.State.Running}}' booking-be 2>/dev/null)" = "true" ]; then
                break
              fi
              sleep 2
            done

            docker compose exec -T booking-be sh -c "npm run db:migrate && npm run db:seed"

            docker image prune -f

      - name: Backoff before retry 2
        if: steps.deploy1.outcome == 'failure'
        run: sleep 20

      - name: Deploy to VPS3 (attempt 2)
        id: deploy2
        if: steps.deploy1.outcome == 'failure'
        continue-on-error: true
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ vars.VPS3_HOST }}
          username: deploy
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          timeout: 60s
          script: |
            set -euo pipefail
            mkdir -p /root/stacks/booking-system
            {
              echo "NODE_ENV=production"
              echo "PORT=${{ vars.PORT }}"
              echo "TZ=Asia/Kuala_Lumpur"
              echo "DATABASE_URL=postgres://${{ secrets.DB_USER }}:${{ secrets.DB_PASSWORD }}@db-booking:5432/${{ secrets.DB_NAME }}"
              echo "SUPERADMIN_EMAIL=${{ vars.SUPERADMIN_EMAIL }}"
              echo "PORTAL_ORIGIN=${{ vars.PORTAL_ORIGIN }}"
              echo "CLIENT_ORIGIN=${{ vars.CLIENT_ORIGIN }}"
              echo "CLERK_STAFF_PUBLISHABLE_KEY=${{ secrets.CLERK_STAFF_PUBLISHABLE_KEY }}"
              echo "CLERK_STAFF_SECRET_KEY=${{ secrets.CLERK_STAFF_SECRET_KEY }}"
              echo "CLERK_STAFF_WEBHOOK_SECRET=${{ secrets.CLERK_STAFF_WEBHOOK_SECRET }}"
              echo "IMPERSONATION_SECRET=${{ secrets.IMPERSONATION_SECRET }}"
              echo "CLERK_CLIENT_PUBLISHABLE_KEY=${{ secrets.CLERK_CLIENT_PUBLISHABLE_KEY }}"
              echo "CLERK_CLIENT_SECRET_KEY=${{ secrets.CLERK_CLIENT_SECRET_KEY }}"
              echo "CLERK_CLIENT_WEBHOOK_SECRET=${{ secrets.CLERK_CLIENT_WEBHOOK_SECRET }}"
              echo "SMTP_USER=${{ secrets.SMTP_USER }}"
              echo "SMTP_PASSWORD=${{ secrets.SMTP_PASSWORD }}"
              echo "STRIPE_SECRET_KEY=${{ secrets.STRIPE_SECRET_KEY }}"
              echo "STRIPE_WEBHOOK_SECRET=${{ secrets.STRIPE_WEBHOOK_SECRET }}"
              echo "R2_ACCOUNT_ID=${{ secrets.R2_ACCOUNT_ID }}"
              echo "R2_ACCESS_KEY_ID=${{ secrets.R2_ACCESS_KEY_ID }}"
              echo "R2_SECRET_ACCESS_KEY=${{ secrets.R2_SECRET_ACCESS_KEY }}"
              echo "R2_BUCKET_NAME=${{ secrets.R2_BUCKET_NAME }}"
              echo "R2_PUBLIC_URL=${{ secrets.R2_PUBLIC_URL }}"
            } > /root/stacks/booking-system/.env.booking-be
            chmod 600 /root/stacks/booking-system/.env.booking-be
            {
              echo "POSTGRES_USER=${{ secrets.DB_USER }}"
              echo "POSTGRES_PASSWORD=${{ secrets.DB_PASSWORD }}"
              echo "POSTGRES_DB=${{ secrets.DB_NAME }}"
            } > /root/stacks/booking-system/.env.booking-db
            chmod 600 /root/stacks/booking-system/.env.booking-db

            docker pull blueprintagency/booking-be:latest
            cd /root/stacks/booking-system
            docker compose up -d --remove-orphans

            for i in $(seq 1 30); do
              if [ "$(docker inspect -f '{{.State.Running}}' booking-be 2>/dev/null)" = "true" ]; then
                break
              fi
              sleep 2
            done

            docker compose exec -T booking-be sh -c "npm run db:migrate && npm run db:seed"

            docker image prune -f

      - name: Backoff before retry 3
        if: steps.deploy1.outcome == 'failure' && steps.deploy2.outcome == 'failure'
        run: sleep 40

      - name: Deploy to VPS3 (attempt 3 — final)
        if: steps.deploy1.outcome == 'failure' && steps.deploy2.outcome == 'failure'
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ vars.VPS3_HOST }}
          username: deploy
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          timeout: 60s
          script: |
            set -euo pipefail
            mkdir -p /root/stacks/booking-system
            {
              echo "NODE_ENV=production"
              echo "PORT=${{ vars.PORT }}"
              echo "TZ=Asia/Kuala_Lumpur"
              echo "DATABASE_URL=postgres://${{ secrets.DB_USER }}:${{ secrets.DB_PASSWORD }}@db-booking:5432/${{ secrets.DB_NAME }}"
              echo "SUPERADMIN_EMAIL=${{ vars.SUPERADMIN_EMAIL }}"
              echo "PORTAL_ORIGIN=${{ vars.PORTAL_ORIGIN }}"
              echo "CLIENT_ORIGIN=${{ vars.CLIENT_ORIGIN }}"
              echo "CLERK_STAFF_PUBLISHABLE_KEY=${{ secrets.CLERK_STAFF_PUBLISHABLE_KEY }}"
              echo "CLERK_STAFF_SECRET_KEY=${{ secrets.CLERK_STAFF_SECRET_KEY }}"
              echo "CLERK_STAFF_WEBHOOK_SECRET=${{ secrets.CLERK_STAFF_WEBHOOK_SECRET }}"
              echo "IMPERSONATION_SECRET=${{ secrets.IMPERSONATION_SECRET }}"
              echo "CLERK_CLIENT_PUBLISHABLE_KEY=${{ secrets.CLERK_CLIENT_PUBLISHABLE_KEY }}"
              echo "CLERK_CLIENT_SECRET_KEY=${{ secrets.CLERK_CLIENT_SECRET_KEY }}"
              echo "CLERK_CLIENT_WEBHOOK_SECRET=${{ secrets.CLERK_CLIENT_WEBHOOK_SECRET }}"
              echo "SMTP_USER=${{ secrets.SMTP_USER }}"
              echo "SMTP_PASSWORD=${{ secrets.SMTP_PASSWORD }}"
              echo "STRIPE_SECRET_KEY=${{ secrets.STRIPE_SECRET_KEY }}"
              echo "STRIPE_WEBHOOK_SECRET=${{ secrets.STRIPE_WEBHOOK_SECRET }}"
              echo "R2_ACCOUNT_ID=${{ secrets.R2_ACCOUNT_ID }}"
              echo "R2_ACCESS_KEY_ID=${{ secrets.R2_ACCESS_KEY_ID }}"
              echo "R2_SECRET_ACCESS_KEY=${{ secrets.R2_SECRET_ACCESS_KEY }}"
              echo "R2_BUCKET_NAME=${{ secrets.R2_BUCKET_NAME }}"
              echo "R2_PUBLIC_URL=${{ secrets.R2_PUBLIC_URL }}"
            } > /root/stacks/booking-system/.env.booking-be
            chmod 600 /root/stacks/booking-system/.env.booking-be
            {
              echo "POSTGRES_USER=${{ secrets.DB_USER }}"
              echo "POSTGRES_PASSWORD=${{ secrets.DB_PASSWORD }}"
              echo "POSTGRES_DB=${{ secrets.DB_NAME }}"
            } > /root/stacks/booking-system/.env.booking-db
            chmod 600 /root/stacks/booking-system/.env.booking-db

            docker pull blueprintagency/booking-be:latest
            cd /root/stacks/booking-system
            docker compose up -d --remove-orphans

            for i in $(seq 1 30); do
              if [ "$(docker inspect -f '{{.State.Running}}' booking-be 2>/dev/null)" = "true" ]; then
                break
              fi
              sleep 2
            done

            docker compose exec -T booking-be sh -c "npm run db:migrate && npm run db:seed"

            docker image prune -f
