name: Test Guardrails

# The checks that keep tests honest, whoever wrote them (#200): the ones that
# need no database. The backend's own no-skip check lives in its `test` job
# (deploy-be.yml), which has the suite's output to hand. See
# docs/md/test-guardrails.md.
#
# Called by deploy-be.yml as its `guardrails` job on every pull request and in
# the merge queue, so a PR runs one workflow. Stateless: nothing here reads the
# base branch or another run.
on:
  workflow_call:

permissions:
  contents: read

jobs:
  # The test-picker hooks (.claude/hooks/) and the repo scripts are tested too.
  scripts:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: node --test "scripts/*.test.mjs" ".claude/hooks/*.test.mjs"

      # Every Scenario Inventory row marked covered must name a test file whose
      # test name still carries its ID (docs/md/testing.md), whichever app the
      # test is in. Prints coverage by role and by risk.
      - name: Scenario Inventory traces to tests
        run: node scripts/check-scenarios.mjs

  # The journeys themselves run in e2e-local.yml. Listing
  # them needs nothing, and is enough to see what a PR did to them.
  e2e:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: e2e
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: e2e/package-lock.json
      - run: npm ci
      - run: npm run check

      # A skipped journey fails CI, as a skipped backend test does: the
      # config's no-skips reporter fails a run — `--list` included — on any
      # `test.skip` / `test.fixme` / `describe.skip`, and CI's forbidOnly on a
      # stray `test.only`. A `test.skip()` inside a journey only shows when it
      # runs, and fails e2e-local.yml then.
      - name: No skipped journeys
        env:
          CI: 'true'
        run: npx playwright test --list
