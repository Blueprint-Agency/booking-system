# One shared stack for every worktree. Without a pinned project name Compose
# derives it from the directory, so a second worktree tries to create a second
# container using the same container_name and collides with the running one.
name: reservetoday

services:
  db:
    image: postgres:16
    container_name: reservetoday-db
    env_file:
      - be/.env
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - reservetoday_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d postgres"]
      interval: 2s
      timeout: 3s
      retries: 15
      start_period: 5s

volumes:
  # Pinned so it is not prefixed into reservetoday_reservetoday_pgdata.
  reservetoday_pgdata:
    name: reservetoday_pgdata
