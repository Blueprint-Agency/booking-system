services:
  db:
    image: postgres:16
    container_name: yoga-sadhana-db
    env_file:
      - be/.env
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - yoga_sadhana_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d postgres"]
      interval: 2s
      timeout: 3s
      retries: 15
      start_period: 5s

volumes:
  yoga_sadhana_pgdata:
